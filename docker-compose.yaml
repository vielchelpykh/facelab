services:
  postgres:
    image: postgres:18.1-bookworm
    container_name: app-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgres
    restart: always
  
  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: socat-port-forwarder
    command: tcp-listen:5432,for,reuseaddr tcp-connect:postgres:5432
    ports:
      - "127.0.0.1:5432:5432"